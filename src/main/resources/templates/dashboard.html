<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Dashboard</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"/>
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>
<div class="container mt-4">
    <div th:replace="~{fragments/messages :: messages}"></div>
    <h2>Dashboard</h2>
    <h4 class="mt-3">My Accounts</h4>
    <div class="row">
        <div class="col-md-4 mb-3" th:each="a : ${accounts}">
            <div class="card">
                <div class="card-body">
                    <h5 class="card-title" th:text="${a.accountNumber}">ACC</h5>
                    <p class="card-text" th:text="${a.accountType}">SAVINGS</p>
                    <p class="card-text">Balance: <strong th:text="${a.balance}">0.00</strong> <span th:text="${a.currency}">USD</span></p>
                    <p>Status: <span th:text="${a.status}">ACTIVE</span></p>
                    <a class="btn btn-sm btn-outline-primary" th:href="@{/accounts/{id}(id=${a.id})}">View</a>
                </div>
            </div>
        </div>
    </div>
    <a class="btn btn-success mb-3" th:href="@{/accounts/new}">Open New Account</a>
    <h4>Recent Transactions</h4>
    <table class="table table-striped">
        <thead><tr><th>Date</th><th>Type</th><th>Amount</th><th>Balance After</th><th>Description</th></tr></thead>
        <tbody>
            <tr th:each="t : ${transactions}">
                <td th:text="${t.createdAt}"></td>
                <td th:text="${t.type}"></td>
                <td th:text="${t.amount}"></td>
                <td th:text="${t.balanceAfter}"></td>
                <td th:text="${t.description}"></td>
            </tr>
            <tr th:if="${#lists.isEmpty(transactions)}">
                <td colspan="5" class="text-center text-muted">No transactions yet.</td>
            </tr>
        </tbody>
    </table>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
