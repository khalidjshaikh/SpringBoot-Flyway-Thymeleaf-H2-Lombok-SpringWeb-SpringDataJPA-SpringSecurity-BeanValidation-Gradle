<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Account History</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"/>
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>
<div class="container mt-4">
    <h2>History for <span th:text="${account.accountNumber}"></span></h2>
    <table class="table table-striped">
        <thead><tr><th>Date</th><th>Type</th><th>Amount</th><th>Balance After</th><th>Description</th><th>Reference</th></tr></thead>
        <tbody>
            <tr th:each="t : ${transactions.content}">
                <td th:text="${t.createdAt}"></td>
                <td th:text="${t.type}"></td>
                <td th:text="${t.amount}"></td>
                <td th:text="${t.balanceAfter}"></td>
                <td th:text="${t.description}"></td>
                <td th:text="${t.referenceNumber}"></td>
            </tr>
            <tr th:if="${#lists.isEmpty(transactions.content)}">
                <td colspan="6" class="text-center text-muted">No transactions.</td>
            </tr>
        </tbody>
    </table>
    <a class="btn btn-secondary" th:href="@{/accounts/{id}(id=${account.id})}">Back</a>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
