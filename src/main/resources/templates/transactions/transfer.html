<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Transfer</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"/>
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>
<div class="container mt-4" style="max-width:500px;">
    <h2>Transfer Funds</h2>
    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
    <div th:replace="~{fragments/messages :: messages}"></div>
    <form th:action="@{/transfer}" th:object="${form}" method="post">
        <div class="mb-3">
            <label class="form-label">From Account</label>
            <select th:field="*{fromAccountId}" class="form-select">
                <option th:each="a : ${accounts}" th:value="${a.id}" th:text="${a.accountNumber} + ' (' + ${a.balance} + ')'"></option>
            </select>
            <div class="text-danger" th:errors="*{fromAccountId}"></div>
        </div>
        <div class="mb-3">
            <label class="form-label">To Account Number</label>
            <input type="text" th:field="*{toAccountNumber}" class="form-control"/>
            <div class="text-danger" th:errors="*{toAccountNumber}"></div>
        </div>
        <div class="mb-3">
            <label class="form-label">Amount</label>
            <input type="number" step="0.01" th:field="*{amount}" class="form-control"/>
            <div class="text-danger" th:errors="*{amount}"></div>
        </div>
        <div class="mb-3">
            <label class="form-label">Description</label>
            <input type="text" th:field="*{description}" class="form-control"/>
        </div>
        <button type="submit" class="btn btn-primary">Transfer</button>
    </form>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
