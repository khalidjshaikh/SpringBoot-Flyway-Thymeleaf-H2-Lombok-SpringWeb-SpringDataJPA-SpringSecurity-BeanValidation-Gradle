<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Transactions</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"/>
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>
<div class="container mt-4">
    <div th:replace="~{fragments/messages :: messages}"></div>
    <h2>Transaction History</h2>
    <form class="row g-2 mb-3" method="get" th:action="@{/transactions}">
        <div class="col-auto">
            <select name="type" class="form-select">
                <option value="">All</option>
                <option th:each="t : ${T(com.artificialintelligence.banking.domain.TransactionType).values()}" th:value="${t}" th:text="${t}" th:selected="${selectedType == t.name()}"></option>
            </select>
        </div>
        <div class="col-auto">
            <button class="btn btn-primary" type="submit">Filter</button>
        </div>
    </form>
    <table class="table table-striped">
        <thead><tr><th>Date</th><th>Type</th><th>Amount</th><th>Balance After</th><th>Description</th><th>Reference</th></tr></thead>
        <tbody>
            <tr th:each="t : ${transactions.content}">
                <td th:text="${t.createdAt}"></td>
                <td th:text="${t.type}"></td>
                <td th:text="${t.amount}"></td>
                <td th:text="${t.balanceAfter}"></td>
                <td th:text="${t.description}"></td>
                <td th:text="${t.referenceNumber}"></td>
            </tr>
            <tr th:if="${#lists.isEmpty(transactions.content)}">
                <td colspan="6" class="text-center text-muted">No transactions.</td>
            </tr>
        </tbody>
    </table>
    <nav th:if="${transactions.totalPages > 1}">
        <ul class="pagination">
            <li class="page-item" th:classappend="${transactions.first} ? disabled">
                <a class="page-link" th:href="@{/transactions(page=${transactions.number-1},type=${selectedType})}">Previous</a>
            </li>
            <li class="page-item" th:each="i : ${#numbers.sequence(0, transactions.totalPages-1)}" th:classappend="${i == transactions.number} ? active">
                <a class="page-link" th:href="@{/transactions(page=${i},type=${selectedType})}" th:text="${i+1}"></a>
            </li>
            <li class="page-item" th:classappend="${transactions.last} ? disabled">
                <a class="page-link" th:href="@{/transactions(page=${transactions.number+1},type=${selectedType})}">Next</a>
            </li>
        </ul>
    </nav>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
