<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Admin Transactions</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"/>
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>
<div class="container mt-4">
    <h2>All Transactions</h2>
    <table class="table table-striped">
        <thead><tr><th>Date</th><th>Account</th><th>Type</th><th>Amount</th><th>Balance After</th><th>Reference</th></tr></thead>
        <tbody>
            <tr th:each="t : ${transactions.content}">
                <td th:text="${t.createdAt}"></td>
                <td th:text="${t.account.accountNumber}"></td>
                <td th:text="${t.type}"></td>
                <td th:text="${t.amount}"></td>
                <td th:text="${t.balanceAfter}"></td>
                <td th:text="${t.referenceNumber}"></td>
            </tr>
        </tbody>
    </table>
    <nav th:if="${transactions.totalPages > 1}">
        <ul class="pagination">
            <li class="page-item" th:classappend="${transactions.first} ? disabled">
                <a class="page-link" th:href="@{/admin/transactions(page=${transactions.number-1})}">Previous</a>
            </li>
            <li class="page-item" th:each="i : ${#numbers.sequence(0, transactions.totalPages-1)}" th:classappend="${i == transactions.number} ? active">
                <a class="page-link" th:href="@{/admin/transactions(page=${i})}" th:text="${i+1}"></a>
            </li>
            <li class="page-item" th:classappend="${transactions.last} ? disabled">
                <a class="page-link" th:href="@{/admin/transactions(page=${transactions.number+1})}">Next</a>
            </li>
        </ul>
    </nav>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
