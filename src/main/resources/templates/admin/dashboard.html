<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Admin Dashboard</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"/>
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>
<div class="container mt-4">
    <h2>Admin Dashboard</h2>
    <div class="row">
        <div class="col-md-4"><div class="card text-center"><div class="card-body"><h3 th:text="${userCount}">0</h3><p>Users</p></div></div></div>
        <div class="col-md-4"><div class="card text-center"><div class="card-body"><h3 th:text="${accountCount}">0</h3><p>Accounts</p></div></div></div>
    </div>
    <div class="mt-3">
        <a class="btn btn-primary" th:href="@{/admin/users}">Users</a>
        <a class="btn btn-primary" th:href="@{/admin/accounts}">Accounts</a>
        <a class="btn btn-primary" th:href="@{/admin/transactions}">Transactions</a>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
