<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Admin Accounts</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"/>
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>
<div class="container mt-4">
    <div th:replace="~{fragments/messages :: messages}"></div>
    <h2>Accounts</h2>
    <table class="table table-striped">
        <thead><tr><th>Number</th><th>Owner</th><th>Type</th><th>Balance</th><th>Status</th><th>Update</th></tr></thead>
        <tbody>
            <tr th:each="a : ${accounts}">
                <td th:text="${a.accountNumber}"></td>
                <td th:text="${a.owner.username}"></td>
                <td th:text="${a.accountType}"></td>
                <td th:text="${a.balance}"></td>
                <td th:text="${a.status}"></td>
                <td>
                    <form th:action="@{/admin/accounts/{id}/status(id=${a.id})}" method="post" class="d-flex">
                        <select name="status" class="form-select form-select-sm me-2">
                            <option value="ACTIVE" th:selected="${a.status.name()=='ACTIVE'}">ACTIVE</option>
                            <option value="FROZEN" th:selected="${a.status.name()=='FROZEN'}">FROZEN</option>
                            <option value="CLOSED" th:selected="${a.status.name()=='CLOSED'}">CLOSED</option>
                        </select>
                        <button class="btn btn-sm btn-primary" type="submit">Save</button>
                    </form>
                </td>
            </tr>
        </tbody>
    </table>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
