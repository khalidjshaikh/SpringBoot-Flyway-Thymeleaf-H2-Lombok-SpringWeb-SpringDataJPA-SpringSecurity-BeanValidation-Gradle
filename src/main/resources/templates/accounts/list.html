<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Accounts</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"/>
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>
<div class="container mt-4">
    <div th:replace="~{fragments/messages :: messages}"></div>
    <div class="d-flex justify-content-between align-items-center">
        <h2>My Accounts</h2>
        <a class="btn btn-success" th:href="@{/accounts/new}">Open New Account</a>
    </div>
    <table class="table table-striped mt-3">
        <thead><tr><th>Account Number</th><th>Type</th><th>Balance</th><th>Currency</th><th>Status</th><th>Actions</th></tr></thead>
        <tbody>
            <tr th:each="a : ${accounts}">
                <td th:text="${a.accountNumber}"></td>
                <td th:text="${a.accountType}"></td>
                <td th:text="${a.balance}"></td>
                <td th:text="${a.currency}"></td>
                <td th:text="${a.status}"></td>
                <td>
                    <a class="btn btn-sm btn-outline-primary" th:href="@{/accounts/{id}(id=${a.id})}">View</a>
                    <a class="btn btn-sm btn-outline-success" th:href="@{/accounts/{id}/deposit(id=${a.id})}">Deposit</a>
                    <a class="btn btn-sm btn-outline-warning" th:href="@{/accounts/{id}/withdraw(id=${a.id})}">Withdraw</a>
                </td>
            </tr>
            <tr th:if="${#lists.isEmpty(accounts)}">
                <td colspan="6" class="text-center text-muted">No accounts yet.</td>
            </tr>
        </tbody>
    </table>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
