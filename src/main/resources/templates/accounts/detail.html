<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Account Detail</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"/>
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>
<div class="container mt-4">
    <div th:replace="~{fragments/messages :: messages}"></div>
    <h2>Account Detail</h2>
    <dl class="row">
        <dt class="col-sm-3">Account Number</dt>
        <dd class="col-sm-9" th:text="${account.accountNumber}"></dd>
        <dt class="col-sm-3">Type</dt>
        <dd class="col-sm-9" th:text="${account.accountType}"></dd>
        <dt class="col-sm-3">Balance</dt>
        <dd class="col-sm-9" th:text="${account.balance} + ' ' + ${account.currency}"></dd>
        <dt class="col-sm-3">Status</dt>
        <dd class="col-sm-9" th:text="${account.status}"></dd>
        <dt class="col-sm-3">Opened</dt>
        <dd class="col-sm-9" th:text="${account.createdAt}"></dd>
    </dl>
    <div class="mb-3">
        <a class="btn btn-success" th:href="@{/accounts/{id}/deposit(id=${account.id})}">Deposit</a>
        <a class="btn btn-warning" th:href="@{/accounts/{id}/withdraw(id=${account.id})}">Withdraw</a>
        <a class="btn btn-info" th:href="@{/accounts/{id}/transactions(id=${account.id})}">History</a>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
