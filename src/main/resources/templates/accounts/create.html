<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Open Account</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"/>
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>
<div class="container mt-4" style="max-width:500px;">
    <h2>Open New Account</h2>
    <div th:replace="~{fragments/messages :: messages}"></div>
    <form th:action="@{/accounts}" th:object="${form}" method="post">
        <div class="mb-3">
            <label class="form-label">Account Type</label>
            <select th:field="*{accountType}" class="form-select">
                <option th:each="t : ${types}" th:value="${t}" th:text="${t}"></option>
            </select>
            <div class="text-danger" th:errors="*{accountType}"></div>
        </div>
        <div class="mb-3">
            <label class="form-label">Initial Deposit</label>
            <input type="number" step="0.01" th:field="*{initialDeposit}" class="form-control"/>
            <div class="text-danger" th:errors="*{initialDeposit}"></div>
        </div>
        <button type="submit" class="btn btn-success">Create</button>
        <a class="btn btn-secondary" th:href="@{/accounts}">Cancel</a>
    </form>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
