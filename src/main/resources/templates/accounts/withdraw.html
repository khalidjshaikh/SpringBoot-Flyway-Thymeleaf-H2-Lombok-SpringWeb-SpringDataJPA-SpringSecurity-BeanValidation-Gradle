<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Withdraw</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"/>
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>
<div class="container mt-4" style="max-width:500px;">
    <h2>Withdraw from <span th:text="${account.accountNumber}"></span></h2>
    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
    <div th:replace="~{fragments/messages :: messages}"></div>
    <p>Available balance: <strong th:text="${account.balance}"></strong></p>
    <form th:action="@{/accounts/{id}/withdraw(id=${account.id})}" th:object="${form}" method="post">
        <div class="mb-3">
            <label class="form-label">Amount</label>
            <input type="number" step="0.01" th:field="*{amount}" class="form-control"/>
            <div class="text-danger" th:errors="*{amount}"></div>
        </div>
        <div class="mb-3">
            <label class="form-label">Description</label>
            <input type="text" th:field="*{description}" class="form-control"/>
        </div>
        <button type="submit" class="btn btn-warning">Withdraw</button>
        <a class="btn btn-secondary" th:href="@{/accounts/{id}(id=${account.id})}">Cancel</a>
    </form>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
